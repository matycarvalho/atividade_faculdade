<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Disciplina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .container { max-width: 700px; margin-top: 40px; }
        .card-header { background-color: #2c3e50; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">Cadastrar Disciplina</h4>
        </div>
        <div class="card-body">

            <form th:action="@{/ofertadisciplina/salvar}" th:object="${oferta_disciplina}" method="post">

                

                <div class="mb-3">
                    <label class="form-label">Disciplina</label>
                    <select class="form-select" name="id_disciplina" required>
                        <option value="">Selecione um curso...</option>
                        <option th:each="disciplina : ${disciplinas}"
                                th:value="${disciplina.idCurso}"
                                th:text="${disciplina.nome}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Professor</label>
                    <select class="form-select" name="id_professor" required>
                        <option value="">Selecione um curso...</option>
                        <option th:each="professor : ${professores}"
                                th:value="${professor.idCurso}"
                                th:text="${professor.nome}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ano</label>
                    <input type="number" class="form-control" th:field="*{ano}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Semestre</label>
                    <input type="number" class="form-control" th:field="*{semestre}" required>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/disciplina/cadastrar}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
