<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastrar Curso</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f4f6f9;
      }

      .container {
        max-width: 700px;
        margin-top: 40px;
      }

      .card-header {
        background-color: #3457d5;
        color: #fff;
      }
    </style>
  </head>

  <body>
    <form method="post" action="/matricula/salvar">
      <label>Aluno:</label>
      <select name="id_aluno">
        <option
          th:each="a : ${alunos}"
          th:value="${a.idAluno}"
          th:each="${a.prontuario}"
        ></option>
      </select>
      <label>Oferta:</label>
      <select name="id_oferta">
        <option
          th:each="o : ${ofertas}"
          th:value="${o.idOferta}"
          th:each="${o.ano}"
        ></option>
      </select>

			<button type="submit">Matricular</button>
    </form>
  </body>
</html>
