<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .container { max-width: 700px; margin-top: 40px; }
        .card-header { background-color: #2c3e50; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">Cadastrar Aluno</h4>
        </div>
        <div class="card-body">

            <form th:action="@{/aluno/salvar}" th:object="${aluno}" method="post">

                <div class="mb-3">
                    <label class="form-label">Prontuário</label>
                    <input type="text" class="form-control" th:field="*{prontuario}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nome da Mãe</label>
                    <input type="text" class="form-control" th:field="*{nomeMae}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Nome do Pai</label>
                    <input type="text" class="form-control" th:field="*{nomePai}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Contato do Responsável</label>
                    <input type="text" class="form-control" th:field="*{contatoResponsavel}">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ano de Ingresso</label>
                        <input type="number" class="form-control" th:field="*{ano_ingresso}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ano de Saída</label>
                        <input type="number" class="form-control" th:field="*{ano_saida}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Curso</label>
                    <select class="form-select" th:field="*{idCurso}" required>
                        <option value="">Selecione um curso...</option>
                        <option th:each="curso : ${cursos}"
                                th:value="${curso.idCurso}"
                                th:text="${curso.nome}">
                        </option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/aluno/cadastrar}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
